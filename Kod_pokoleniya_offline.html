function setFilter(i){filter=i;const y=window.scrollY;home();window.scrollTo(0,y)}
function setup(i){const g=games[i];page(`<div class="breadcrumbs"><a href="#games">Миссии</a><span>/</span><span>${g.name}</span></div><div class="page-title"><span class="overline">${g.type} · ${g.age}</span><h1>${g.name}</h1><p>${g.intro}</p></div><div class="two-col"><div class="panel"><h2>Соберите команду</h2><div class="meta-row"><span>${icon('clock')}${g.duration} минут</span><span>${icon('people')}4–6 участников на команду</span></div><div class="setup-banner"><strong>Рекомендуемая шефская пара</strong><p>${g.pair}. Педагог сопровождает проведение.</p></div><label class="field" for="team">Название команды</label><input id="team" type="text" maxlength="50" value="Команда добрых дел" autocomplete="off"><p class="field-hint">Используйте общее название, без фамилий участников.</p><ol class="checklist"><li><b>1</b><span>Распечатайте отдельные карточки для участников и наставников.</span></li><li><b>2</b><span>Подготовьте бумагу и карандаши. Договоритесь, кто читает, кто действует и кто проверяет.</span></li><li><b>3</b><span>Покажите игру на экране. Ключи к заданиям держите на отдельной распечатке.</span></li></ol><div class="actions"><button class="button red" onclick="begin(${i})">Начать миссию</button><button class="button ghost" onclick="openMaterials(${i})">Подготовить карточки</button></div><p class="field-hint">Текущее проведение сохраняется только пока открыта эта страница. Для урока без интернета скачайте офлайн-версию.</p></div><aside class="stack"><div class="panel"><h3>Маршрут команды</h3><ol class="step-list">${g.steps.map((s,j)=>`<li><span>0${j+1}</span>${s.title}<small>${s.minutes} мин</small></li>`).join('')}</ol></div><div class="note-panel"><strong>${g.theme}</strong><p style="margin-top:8px">Результат за пределами игры: ${g.result.toLowerCase()}.</p></div></aside></div>`)}
function begin(i){const team=document.getElementById('team').value.trim()||'Команда добрых дел';const run=()=>{stopTimer();session={game:i,stage:0,team,states:[],remaining:games[i].steps[0].minutes*60,running:false,finished:false};navigate('play');if(location.hash==='#play')renderStage()};if(session&&!session.finished){confirmAction('Начать новое проведение?','Текущие ответы и время предыдущей команды будут сброшены.',run)}else run()}
function state(){return session.states[session.stage]??=( {choice:null,sequence:[],path:['A1'],budget:[],text:'',verified:false,hint:false,ack:false,branchRound:false,branchDone:false})}
function checkConfig(){return checks[`${session.game}-${session.stage}`]}
function renderStage(){const g=games[session.game],s=g.steps[session.stage],st=state();page(`<div class="session-bar"><div><a class="button text" href="#games">К выбору миссий</a><p class="session-name">${esc(session.team)} · ${g.name}</p></div><div class="actions"><button class="button ghost small" onclick="toggleProjection()" id="screenButton">${projection?'Обычный режим':'На проектор'}</button><button class="button ghost small screen-hide" onclick="openMaterials(${session.game})">Карточки</button></div></div><div class="session-layout"><aside class="rail"><div><span class="overline">Маршрут миссии</span><ol>${g.steps.map((x,i)=>`<li class="${i===session.stage?'current':i<session.stage?'done':''}"><span class="stage-no">${i<session.stage?'✓':i+1}</span>${x.title}</li>`).join('')}</ol><div class="progress"><span style="width:${session.stage*20}%"></span></div><p class="small-text">${session.stage} из 5 этапов завершено</p></div><div class="timer-panel"><span class="overline" style="margin:0">Время этапа</span><div class="clock" id="clock"></div><div class="timer-actions"><button class="button small" id="timerButton" onclick="toggleTimer()">Старт</button><button class="button ghost small" onclick="addMinute()" aria-label="Добавить одну минуту">+1 мин</button></div><p class="field-hint" id="timeNote">Таймер помогает распределять время. Он не закрывает задание.</p></div></aside><section class="stage-panel"><span class="overline">ЭТАП 0${session.stage+1} / 05 · ${g.subtitle}</span><h1>${s.title}</h1><p class="task">${s.task}</p><div class="task-card"><strong>Карточка участников</strong><p>${s.child}</p></div><div class="workspace" id="workspace">${workspace()}</div><div id="feedback" role="status" aria-live="polite"></div><button class="button text" onclick="showHint()">${icon('compass')}Подсказка команде</button><div id="hintArea">${st.hint?`<div class="hint-box">${s.hint}</div>`:''}</div><details class="teacher-section"><summary>Открыть заметки ведущего — только на личном экране</summary><p><strong>Наставнику:</strong> ${s.mentor}</p><p><strong>Проверка:</strong> ${s.answer}</p><p><strong>Вопрос для обсуждения:</strong> ${s.reflection}</p></details><label class="ack"><input type="checkbox" id="ack" ${st.ack?'checked':''} onchange="state().ack=this.checked"><span>Мы обсудили результат. Каждый получил возможность внести свой вклад.</span></label><div class="stage-bottom"><button class="button ghost" onclick="previous()" ${session.stage===0?'disabled':''}>Предыдущий этап</button><button class="button" onclick="nextStage()">${session.stage===4?'Завершить миссию':'Продолжить миссию'}</button></div></section></div>`);updateClock();if(session.running)startInterval()}
function workspace(){const c=checkConfig(),st=state();if(!c)return `<label class="field" for="response">Зафиксируйте общее решение</label><textarea id="response" placeholder="Что решили вместе? Запишите коротко." oninput="state().text=this.value;state().verified=false">${esc(st.text)}</textarea><p class="field-hint">Можно обсудить ответ устно и записать его вместе с наставником. Открытое задание оценивает ведущий по критериям.</p><label class="ack"><input type="checkbox" id="manual" ${st.verified?'checked':''} onchange="state().verified=this.checked"><span>Ведущий проверил результат по критериям задания.</span></label>`;
let out='';if(c.type==='choice'||c.type==='branch')out=`<div class="choices">${c.options.map((x,i)=>`<button class="choice ${st.choice===i?'selected':''}" aria-pressed="${st.choice===i}" onclick="selectChoice(${i})"><span class="letter">${String.fromCharCode(65+i)}</span>${x}</button>`).join('')}</div>`;
if(c.type==='text')out=`<label class="field" for="response">Ответ команды</label><input id="response" type="text" maxlength="120" value="${esc(st.text)}" placeholder="${c.placeholder}" oninput="state().text=this.value;state().verified=false" onkeydown="if(event.key==='Enter')verify()" autocomplete="off">`;
if(c.type==='sequence')out=`<p class="small-text">Нажимайте элементы в согласованном порядке.</p><div class="sequence-result" aria-live="polite">${st.sequence.length?st.sequence.map(i=>`<span>${c.options[i]}</span>`).join(''):'Здесь появится ваша последовательность'}</div><div class="sequence-bank">${c.options.map((x,i)=>`<button class="button ghost" ${st.sequence.includes(i)?'disabled':''} onclick="sequenceAdd(${i})">${x}</button>`).join('')}</div><button class="button text small" onclick="resetPuzzle()">Очистить последовательность</button>`;
if(c.type==='path')out=`<p class="small-text">Начните в A1. Узнайте у наставника, какие клетки закрыты.</p><div class="map">${['A1','B1','C1','A2','B2','C2','A3','B3','C3'].map(cell=>`<button class="choice ${st.path.includes(cell)?'selected':''}" onclick="pathAdd('${cell}')" aria-pressed="${st.path.includes(cell)}">${cell}<small>${cell==='A1'?'Школа':cell==='C3'?'Архив':st.path.includes(cell)?'Шаг '+(st.path.indexOf(cell)+1):'Квартал'}</small></button>`).join('')}</div><p class="small-text" aria-live="polite">Маршрут: ${st.path.join(' · ')}</p><button class="button text" onclick="resetPuzzle()">Начать маршрут заново</button>`;
if(c.type==='budget'){const total=st.budget.reduce((sum,i)=>sum+initiatives[i][1],0);out=`<p class="small-text">Выберите ${c.min===3?'не менее трёх инициатив':'инициативы'}. Цены — условные игровые единицы.</p><div class="budget-value ${total>c.limit?'over':''}"><strong>${total}</strong><span>из ${c.limit} единиц</span></div><div class="budget-grid">${initiatives.map(([name,price],i)=>`<button class="choice ${st.budget.includes(i)?'selected':''}" aria-pressed="${st.budget.includes(i)}" onclick="budgetToggle(${i})"><span style="flex:1">${name}</span><strong>${price}</strong></button>`).join('')}</div><label class="field" for="response">Почему выбрали именно это?</label><textarea id="response" oninput="state().text=this.value;state().verified=false" placeholder="Чьи интересы учли? Что перенесли на потом?">${esc(st.text)}</textarea>`}
if(c.type==='branch'&&st.branchRound)out+=`<div class="hint-box"><strong>Дополнительный круг: услышать каждого</strong><p>Дайте каждому по 30 секунд: какую часть он готов взять? Затем распределите роли и пересмотрите план.</p><label class="ack"><input type="checkbox" ${st.branchDone?'checked':''} onchange="state().branchDone=this.checked;state().verified=false">Мы провели круг и услышали все предложения</label></div>`;
return out+`<div class="actions" style="margin-top:18px"><button class="button ghost" onclick="verify()">Проверить решение</button>${st.verified?'<span class="pill">✓ Решение проверено</span>':''}</div>`}
function refreshWorkspace(){document.getElementById('workspace').innerHTML=workspace();document.getElementById('feedback').innerHTML=''}
function selectChoice(i){const st=state();st.choice=i;st.verified=false;refreshWorkspace()}
function sequenceAdd(i){const st=state();if(!st.sequence.includes(i))st.sequence.push(i);st.verified=false;refreshWorkspace()}
function pathAdd(cell){const st=state(),last=st.path.at(-1);if(cell==='A1'){st.path=['A1'];st.verified=false;refreshWorkspace();return}if(st.path.includes(cell)){feedback('Эта клетка уже есть в маршруте. Начните заново, чтобы изменить путь.');return}const d=Math.abs(cell.charCodeAt(0)-last.charCodeAt(0))+Math.abs(+cell[1]- +last[1]);if(d!==1){feedback('Выберите соседнюю клетку: один шаг по горизонтали или вертикали.');return}st.path.push(cell);st.verified=false;refreshWorkspace()}
function budgetToggle(i){const st=state();st.budget=st.budget.includes(i)?st.budget.filter(x=>x!==i):[...st.budget,i];st.verified=false;refreshWorkspace()}
function resetPuzzle(){const st=state();st.sequence=[];st.path=['A1'];st.verified=false;refreshWorkspace()}
const normalize=s=>s.toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9]/g,'');
function evaluate(c,st){if(!c)return st.verified&&st.text.trim().length>0;if(c.type==='text')return c.answers.some(a=>normalize(a)===normalize(st.text));if(c.type==='sequence')return JSON.stringify(st.sequence)===JSON.stringify(c.correct);if(c.type==='choice')return st.choice===c.correct;if(c.type==='branch')return st.choice===c.correct&&(!st.branchRound||st.branchDone);if(c.type==='path')return JSON.stringify(st.path)===JSON.stringify(c.correct);if(c.type==='budget')return st.budget.length>=c.min&&st.budget.reduce((sum,i)=>sum+initiatives[i][1],0)<=c.limit&&st.text.trim().length>0;return false}
function verify(){const c=checkConfig(),st=state();if(!c)return;if(c.type==='branch'&&st.choice!==null&&st.choice!==c.correct){st.branchRound=true;st.verified=false;refreshWorkspace();feedback('В этом плане не хватает распределения ролей. Открылся дополнительный круг обсуждения.');return}st.verified=evaluate(c,st);refreshWorkspace();feedback(st.verified?'Решение принято. Обсудите, как вы пришли к нему вместе.':c.type==='budget'?'Проверьте число инициатив, общую стоимость и запишите обоснование.':c.type==='branch'&&st.branchRound&&!st.branchDone?'Сначала завершите дополнительный круг обсуждения.':'Пока не сходится. Сверьте информацию с наставником и попробуйте ещё раз.',st.verified)}
function feedback(message,good=false){document.getElementById('feedback').innerHTML=`<div class="feedback ${good?'good':''}">${message}</div>`}
function showHint(){state().hint=true;document.getElementById('hintArea').innerHTML=`<div class="hint-box">${games[session.game].steps[session.stage].hint}</div>`}
function nextStage(){const st=state(),c=checkConfig();if(!st.verified||!evaluate(c,st)){feedback(c?'Сначала проверьте решение задания.':'Запишите общее решение и попросите ведущего подтвердить его.');return}if(!st.ack){feedback('Перед переходом обсудите результат и отметьте участие команды.');return}stopTimer();if(session.stage===4){session.finished=true;projection=false;document.body.classList.remove('screen');finish()}else{session.stage++;session.remaining=games[session.game].steps[session.stage].minutes*60;renderStage()}}
function previous(){if(!session.stage)return;stopTimer();session.stage--;session.remaining=games[session.game].steps[session.stage].minutes*60;renderStage()}
function updateClock(){const c=document.getElementById('clock');if(!c)return;c.textContent=String(Math.floor(session.remaining/60)).padStart(2,'0')+':'+String(session.remaining%60).padStart(2,'0');document.getElementById('timerButton').textContent=session.running?'Пауза':session.remaining===0?'Ещё минута':'Старт'}
function startInterval(){clearInterval(interval);interval=setInterval(()=>{session.remaining=Math.max(0,Math.ceil((session.deadline-Date.now())/1000));if(!session.remaining){stopTimer();document.getElementById('timeNote').textContent='Время этапа вышло. Можно добавить минуту и закончить обсуждение.';toast('Время этапа вышло. Завершите обсуждение в своём темпе.')}updateClock()},250)}
function toggleTimer(){if(session.running)stopTimer();else{if(!session.remaining)session.remaining=60;session.deadline=Date.now()+session.remaining*1000;session.running=true;startInterval()}updateClock()}
function addMinute(){session.remaining+=60;if(session.running)session.deadline+=60000;updateClock()}
function toggleProjection(){projection=!projection;document.body.classList.toggle('screen',projection);document.getElementById('screenButton').textContent=projection?'Обычный режим':'На проектор';document.querySelectorAll('.teacher-section').forEach(d=>d.open=false);toast(projection?'Заметки ведущего скрыты. Для выхода нажмите «Обычный режим».':'Обычный режим включён')}
function finish(){const g=games[session.game];page(`<div class="finish-panel"><span class="overline">Миссия завершена · 5 из 5 этапов</span><h1>Связь установлена!</h1><p>${esc(session.team)}, вы объединили свои знания и помогли друг другу пройти маршрут. Следующий шаг — общее дело за пределами экрана.</p><div class="badge-row">${g.skills.map(s=>`<span class="badge">✓ ${s}</span>`).join('')}</div><div class="actions" style="justify-content:center"><button class="button light" onclick="printCertificate()">Сертификат команды</button><a class="button light" href="#games">Другие миссии</a></div></div><div class="two-col"><section class="panel"><span class="overline">Миссия на неделю</span><h2>${g.result}</h2><p>${g.mission}</p><div class="setup-banner"><strong>Договоритесь о первом шаге</strong><p>Что сделаете? Кто участвует? Когда встретитесь, чтобы обсудить результат?</p></div><button class="button ghost" onclick="openMaterials(${session.game},'mission')">Распечатать план дела</button></section><aside class="panel"><h3>Обсудите вместе</h3><ol class="checklist"><li>Когда вам понадобилась помощь?</li><li>Чему вы научились друг у друга?</li><li>Как это поможет вашей школе или родному краю?</li></ol><p class="small-text">Подсказки использованы на ${session.states.filter(s=>s.hint).length} этапах. Это поддержка, а не штраф.</p></aside></div>`)}
function confirmAction(title,message,action){const d=document.getElementById('dialog');document.getElementById('dialogContent').innerHTML=`<h2>${title}</h2><p>${message}</p><div class="actions"><button class="button" id="confirmAction">Начать заново</button><button class="button ghost" id="cancelAction">Отмена</button></div>`;document.getElementById('confirmAction').onclick=()=>{d.close();action()};document.getElementById('cancelAction').onclick=()=>d.close();d.showModal()}
function openMaterials(i,type='participants'){materialGame=i;materialType=type;if(location.hash==='#materials')materials();else navigate('materials')}

function printable(){const list=materialGame===-1?games: [games[materialGame]];return list.map(g=>{const i=games.indexOf(g);if(materialType==='participants'||materialType==='mentors'){const who=materialType==='participants';return g.steps.map((s,j)=>`<article class="paper">${paperHeader(who?'Карточка участников':'Карточка наставника')}<span class="overline">${g.name} · Этап ${j+1}</span><h2>${s.title}</h2><p>${g.pair}</p><div class="cut-card"><h3>${who?'Ваша часть информации':'Ваша часть задания'}</h3><p>${who?s.child:s.mentor}</p>${who&&checks[`${i}-${j}`]?.type==='path'?'<table><tr><td>A1 · школа</td><td>B1</td><td>C1</td></tr><tr><td>A2</td><td>B2</td><td>C2</td></tr><tr><td>A3</td><td>B3</td><td>C3 · архив</td></tr></table>':''}</div><p>${who?'Объясняйте информацию напарнику словами. Слушайте, уточняйте, принимайте решение вместе.':'Не выполняйте задание за участников. Дайте время объяснить решение и задайте уточняющий вопрос.'}</p><h3>Наши заметки</h3><div class="writing-lines"></div></article>`).join('')}
if(materialType==='guide')return `<article class="paper">${paperHeader('Руководство ведущего · ответы')}<h2>${g.name}</h2><p><strong>Шефская пара:</strong> ${g.pair}.</p><p><strong>Цель:</strong> ${g.theme.toLowerCase()} через совместные задания и обмен информацией.</p><p><strong>Продолжительность:</strong> ${g.duration} минут. Этапы: ${g.steps.map(s=>s.minutes).join(' + ')} минут; ещё ${g.duration-g.steps.reduce((sum,s)=>sum+s.minutes,0)} минут на вступление, переходы и итог.</p><p><strong>Подготовка:</strong> один комплект отдельных карточек на команду, бумага, карандаши, ноутбук; проектор по возможности. В каждой команде 4–6 участников. Для 1–5 наставников организуйте 1–5 команд; педагог сопровождает работу.</p><p><strong>Вступление:</strong> «Сегодня у каждого будет часть важной информации. Задавайте вопросы и помогайте друг другу. Ошибка — повод уточнить решение. Наша цель — пройти маршрут вместе».</p><p><strong>Сюжет:</strong> ${g.intro}</p><p>На общем экране показывайте режим «На проектор». Ключи держите у ведущего. Автоматическая проверка подтверждает ответ головоломки; участие детей и открытые решения проверяет ведущий.</p></article>`+g.steps.map((s,j)=>`<article class="paper">${paperHeader('Только для ведущего')}<h2>${j+1}. ${s.title}</h2><p><strong>Время:</strong> ${s.minutes} минут.</p><p><strong>Инструкция группе:</strong> ${s.task}</p><p><strong>Действия наставника:</strong> ${s.mentor}</p><p><strong>Критерий завершения:</strong> ${s.answer}</p><p><strong>Подсказка:</strong> ${s.hint}</p><p><strong>Рефлексия:</strong> ${s.reflection}</p><p>Если участники затрудняются, сначала дайте им объяснить свои варианты. Затем предложите подсказку. Если кто-то не включён в работу, назначьте ему посильную роль по согласованию.</p></article>`).join('');
if(materialType==='mission')return `<article class="paper">${paperHeader('План реального дела')}<h2>${g.result}</h2><p>${g.mission}</p>${['Название команды и дата','Что хотим сделать и кому это поможет','Первый шаг и необходимые материалы','Посильная роль каждого участника','Когда проверим результат','Что сделали на самом деле; что изменим'].map(x=>`<h3>${x}</h3><div class="writing-lines"></div>`).join('')}</article>`;
return `<article class="paper">${paperHeader('Лист наблюдения')}<h2>${g.name}</h2><p>Дата: __________ Команда: ______________________</p><p>Отмечайте: Н — не наблюдалось, П — с помощью, С — самостоятельно. Это наблюдение педагога, не психологический тест.</p><table><thead><tr><th>Действие</th><th>Первый этап</th><th>Последний этап</th></tr></thead><tbody>${['Каждый получает возможность высказаться','Участники уточняют непонятное','Объясняют решение напарнику','Договариваются о ролях'].map(x=>`<tr><td>${x}</td><td>______</td><td>______</td></tr>`).join('')}</tbody></table><h3>Конкретный пример сотрудничества</h3><div class="writing-lines"></div><h3>Отзывы: «Мне помогло…», «Мне было трудно…»</h3><div class="writing-lines"></div><h3>Что изменить перед следующим проведением</h3><div class="writing-lines"></div></article>`}).join('')}
function materials(){page(`<div class="page-title"><span class="overline">Всё для проведения</span><h1>Мастерская материалов</h1><p>Выберите игру и тип комплекта. Карточки участников печатаются отдельно от инструкций и ключей.</p></div><div class="resource-grid no-print"><div class="resource-card">${icon('book')}<h3>Две стороны задания</h3><p>Разные карточки для участников и наставников сохраняют главный принцип: решить задачу можно вместе.</p></div><div class="resource-card">${icon('print')}<h3>Готово к печати</h3><p>Формат A4, отдельные страницы, читаемый чёрно-белый вариант. В окне печати можно выбрать «Сохранить как PDF».</p></div><div class="resource-card">${icon('leaf')}<h3>Продолжение в жизни</h3><p>План дела на неделю и лист наблюдения помогают обсудить реальный результат после игры.</p></div></div><div class="print-controls no-print"><label><span class="field">Игра</span><select id="materialGame" onchange="materialGame=+this.value;renderPrint()"><option value="-1" ${materialGame===-1?'selected':''}>Все пять игр</option>${games.map((g,i)=>`<option value="${i}" ${materialGame===i?'selected':''}>${g.name} · ${g.age}</option>`).join('')}</select></label><label><span class="field">Тип материала</span><select id="materialType" onchange="materialType=this.value;renderPrint()">${[['participants','Карточки участников'],['mentors','Карточки наставников'],['guide','Сценарий и ответы ведущего'],['mission','План дела на неделю'],['observation','Лист наблюдения']].map(([id,t])=>`<option value="${id}" ${materialType===id?'selected':''}>${t}</option>`).join('')}</select></label><button class="button" onclick="window.print()">${icon('print')}Печать / PDF</button></div><div id="printPreview">${printable()}</div>`,'materials')}
function renderPrint(){document.getElementById('printPreview').innerHTML=printable()}
function mentor(){page(`<div class="page-title"><span class="overline">Проводим вместе</span><h1>Хороший наставник<br>помогает раскрыться.</h1><p>У младших — свои наблюдения и идеи. У старших — опыт и часть информации. Задача наставника: сделать так, чтобы в общем результате был вклад каждого.</p></div><div class="mentor-grid"><article class="panel">${icon('people')}<h3 style="margin-top:15px">Перед встречей</h3><p>Пройдите задания сами. Подготовьте отдельные карточки, распределите роли с педагогом и проверьте офлайн-версию.</p></article><article class="panel">${icon('compass')}<h3 style="margin-top:15px">Во время игры</h3><p>Вместо готового ответа спросите: «Что уже известно?», «Как проверим?», «Чья идея ещё не прозвучала?» Дайте время подумать.</p></article><article class="panel">${icon('heart')}<h3 style="margin-top:15px">После игры</h3><p>Обсудите конкретные действия команды. Выберите маленькое полезное дело и назначьте встречу через неделю.</p></article></div><section class="panel" style="margin-top:24px"><span class="overline">Шефская вертикаль в практике</span><h2>Пары классов и роли</h2><div class="table-wrap"><table><thead><tr><th>Игра</th><th>Кто работает вместе</th><th>Результат</th></tr></thead><tbody>${games.map(g=>`<tr><td>${g.name}</td><td>${g.pair}</td><td>${g.result}</td></tr>`).join('')}</tbody></table></div><p class="small-text">Пары — рекомендуемая модель проведения, не утверждение о членстве участников в организациях. Содержание можно адаптировать к возможностям детей вместе с педагогом.</p></section><div class="two-col" style="margin-top:24px"><section class="panel"><h2>Родной край — в конкретных делах</h2><p>Узнать историю своего места и проверить источник. Поблагодарить человека, который заботится о школе. Сохранить семейное воспоминание с разрешения рассказчика. Вместе улучшить школьный двор.</p><p>Вопросы для обсуждения: «Почему это место важно для тебя?», «Как мы можем о нём заботиться?», «Чему старшие и младшие могут научиться друг у друга?»</p><div class="setup-banner"><strong>Поддержка разных участников</strong><p>Читайте инструкции вслух, разрешайте ответ рисунком, увеличивайте время и предлагайте спокойные роли. Не сравнивайте детей по скорости.</p></div></section><aside class="panel"><h3>Для конкурсной работы</h3><p>Рекомендуемая номинация по предоставленному положению: <strong>«Шефский десант»</strong>.</p><p>На титульном листе нужны полное название учреждения, номинация, название разработки, ФИО автора, должность и контактный телефон.</p><p class="small-text">Разработка пока не апробирована. После проведения добавьте реальные наблюдения и отзывы; титульные данные заполняются автором и педагогом.</p></aside></div><section class="note-panel" style="margin-top:24px"><strong>О символике</strong><p>Логотипы приведены в контексте методической разработки. Источники: <a href="https://brpo.by/" target="_blank" rel="noopener" style="text-decoration:underline">официальный сайт БРПО</a> и <a href="https://brsm.by/ru/simvolika-ru/" target="_blank" rel="noopener" style="text-decoration:underline">официальная страница символики БРСМ</a>. Проект не заявляет об официальном одобрении организаций.</p></section>`,'mentor')}
